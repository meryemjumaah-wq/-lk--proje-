<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geri Sayım</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;text-align:center}
.kutu{background:rgba(0,0,0,0.3);padding:30px;border-radius:20px}
#sayac{font-size:40px;font-weight:bold;margin-top:20px}
</style>
</head>
<body>
<div class="kutu">
<h1>🎉 Etkinliğe Kalan Süre</h1>
<div id="sayac">Yükleniyor...</div>
<p>Tarihi değiştirmek için kod içindeki tarihi değiştir!</p>
</div>
<script>
var hedefTarih = new Date("Dec 31, 2026 00:00:00").getTime();
setInterval(function(){
var simdi = new Date().getTime();
var fark = hedefTarih - simdi;
var gun = Math.floor(fark/(1000*60*60*24));
var saat = Math.floor((fark%(1000*60*60*24))/(1000*60*60));
var dk = Math.floor((fark%(1000*60*60))/(1000*60));
var sn = Math.floor((fark%(1000*60))/1000);
document.getElementById("sayac").innerHTML = gun+" Gün "+saat+" Saat "+dk+" Dk "+sn+" Sn";
if(fark<0){document.getElementById("sayac").innerHTML="Süre Doldu!"}
},1000);
</script>
</body>
</html>
