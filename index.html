<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Meryem'in Dünyası 💖</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffafcc,#ffc8dd,#cdb4db);font-family:sans-serif;text-align:center} .card{background:white;padding:30px;border-radius:30px;box-shadow:0 20px 40px rgba(0,0,0,0.15);max-width:320px} h1{color:#ff4d8d} .heart{font-size:60px;animation:beat 1s infinite;display:block} button{background:#ff4d8d;color:white;border:none;padding:12px 25px;border-radius:50px;font-size:16px;margin-top:15px} @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}</style></head><body><div class="card"><span class="heart">💖</span><h1>Merhaba!</h1><p>Bu benim ilk websitem!<br>Meryem tarafından yapıldı ✨</p><button onclick="alert('Seni seviyorum dünya! 💖')">Tıkla 💌</button></div></body></html>
